<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POX Forms Detection</title>
</head>
<body>
<!-- Netlify static form parser detection file -->
<form name="request" method="POST" action="/" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="request">
  <input name="bot-field">
  <input type="text" name="name">
  <input type="text" name="contact">
  <input type="text" name="project">
  <input type="text" name="device">
  <textarea name="message"></textarea>
</form>
</body>
</html>
