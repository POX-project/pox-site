<!DOCTYPE html>
<html lang="en">
<head>
<title>POX · Request</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/poxlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body data-page="request" data-theme="indigo">
<div class="pblur" aria-hidden="true"><i class="tint"></i><i></i><i></i><i></i><i></i><i></i></div>
<header class="header" id="header">
  <nav class="nav">
    <a class="brand" id="brand" href="#home"><img id="logo" alt="POX logo"><span id="brandName">POX</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="links" aria-label="Open navigation">Menu <span aria-hidden="true">+</span></button>
        <div class="links" id="links"></div>
    <div class="ctas">
      <a class="btn req" id="ctaRequest"></a>
      <a class="btn don" id="ctaDonation"></a>
    </div>
  </nav>
</header>
<!-- Netlify Forms build detector for SPA/JS form -->
<form name="request" method="POST" action="/" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="request">
  <input name="bot-field">
  <input type="text" name="name">
  <input type="text" name="contact">
  <input type="text" name="project">
  <input type="text" name="device">
  <textarea name="message"></textarea>
</form>
<main id="request"></main>
<footer class="footer" id="footer" data-theme="indigo"></footer>
<script src="js/app.js?v=13"></script>
</body>
</html>
